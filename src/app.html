<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
		<style>html,body{background:#0d1117;margin:0;font-family:system-ui,sans-serif}</style>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('pokeremote:theme');
					if (t !== 'light' && t !== 'dark') t = 'dark';
					document.documentElement.dataset.theme = t;
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
				var r = sessionStorage.getItem('poke-redirect');
				if (r) {
					sessionStorage.removeItem('poke-redirect');
					history.replaceState(null, '', r);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript>
			<div id="noscript">JavaScript is required to run this app.</div>
		</noscript>
	</body>
</html>
