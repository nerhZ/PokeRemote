<!doctype html>
<html
  lang="en"
  style="margin: 0; padding: 0; background-color: #0d1117; min-height: 100%"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pokeremote:theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light")
            document.documentElement.style.backgroundColor = "#f0f3f9";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      addEventListener("error", function (e) {
        if (e.message && e.message.includes("dynamically imported module")) {
          window.location.reload();
        }
      });
    </script>
    <style>
      /* Global reset plus selection and scrollbar styling. StyleX has no
         global selectors and this CSS must exist before the bundle loads, so
         it lives here. @layer base keeps StyleX rules winning over it. */
      @layer base {
        *,
        ::before,
        ::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          border: 0 solid;
        }
        html {
          line-height: 1.5;
          -webkit-text-size-adjust: 100%;
          tab-size: 4;
          -webkit-tap-highlight-color: transparent;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          font-size: inherit;
          font-weight: inherit;
        }
        a {
          color: inherit;
          text-decoration: inherit;
        }
        button,
        input,
        select,
        optgroup,
        textarea {
          font: inherit;
          letter-spacing: inherit;
          color: inherit;
          background-color: transparent;
          border-radius: 0;
          opacity: 1;
        }
        img,
        svg,
        video,
        canvas {
          display: block;
          vertical-align: middle;
        }
        ::placeholder {
          opacity: 1;
        }
      }
      ::selection {
        background-color: #3884ff;
        color: white;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.3);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.45);
      }

      html {
        font-size: 16px;
        min-height: 100%;
        background-color: #0d1117;
        color-scheme: dark;
      }
      body {
        font-family:
          "Outfit",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        background-color: #0d1117;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html[data-theme="light"] {
        background-color: #f0f3f9;
        color-scheme: light;
      }
      [data-theme="light"] body {
        background-color: #f0f3f9;
        color: #0f172a;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #0d1117;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(56, 132, 255, 0.07) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 90% 60%,
            rgba(255, 62, 62, 0.05) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(56, 132, 255, 0.04) 0%,
            transparent 35%
          );
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease-out;
      }
      [data-theme="light"] #app-loader {
        background-color: #f0f3f9;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(56, 132, 255, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 90% 60%,
            rgba(255, 62, 62, 0.07) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(56, 132, 255, 0.06) 0%,
            transparent 35%
          );
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-loader"></div>
    <div style="display: contents">%sveltekit.body%</div>
    <noscript>
      <div id="noscript">JavaScript is required to run this app.</div>
    </noscript>
  </body>
</html>
