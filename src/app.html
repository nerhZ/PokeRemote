<!doctype html>
<html
  lang="en"
  style="margin: 0; padding: 0; background-color: #0d1117; min-height: 100%"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pokeremote:theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light")
            document.documentElement.style.backgroundColor = "#f0f3f9";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      addEventListener("error", function (e) {
        if (e.message && e.message.includes("dynamically imported module")) {
          window.location.reload();
        }
      });
    </script>
    <style>
      html {
        font-size: 16px;
        min-height: 100%;
        background-color: #0d1117;
      }
      body {
        font-family:
          "Outfit",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        background-color: #0d1117;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      [data-theme="light"] html {
        background-color: #f0f3f9;
      }
      [data-theme="light"] body {
        background-color: #f0f3f9;
        color: #0f172a;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #0d1117;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(56, 132, 255, 0.07) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 90% 60%,
            rgba(255, 62, 62, 0.05) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(56, 132, 255, 0.04) 0%,
            transparent 35%
          );
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease-out;
      }
      [data-theme="light"] #app-loader {
        background-color: #f0f3f9;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(56, 132, 255, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 90% 60%,
            rgba(255, 62, 62, 0.07) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(56, 132, 255, 0.06) 0%,
            transparent 35%
          );
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-loader"></div>
    <div style="display: contents">%sveltekit.body%</div>
    <noscript>
      <div id="noscript">JavaScript is required to run this app.</div>
    </noscript>
  </body>
</html>
