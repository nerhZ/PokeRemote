name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
      - run: |
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><script>
          sessionStorage.setItem("poke-redirect",location.pathname+location.search+location.hash);
          location.replace("/${{ github.event.repository.name }}/");
          </script></head></html>' > build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
